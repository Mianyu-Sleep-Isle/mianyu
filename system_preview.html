<body>
  <main class="phone" id="app" aria-label="眠屿移动端应用">
    <section class="view active" id="sceneView">
      <div class="scene-bg" id="sceneBg"></div>
      <header class="brandbar" id="brandbar">
        <img class="brand-icon" src="assets/images/brand/app_icon.png" alt="眠屿图标" />
        <div class="brand-copy"><strong>眠屿</strong><span>在声音里，遇见更好的自己</span></div>
        <button class="mode-pill" id="modeButton" type="button"><b>☾</b><span>夜晚</span><span>⌄</span></button>
      </header>
      <header class="editbar hidden" id="editbar">
        <button class="round-btn" id="backEdit" aria-label="返回">‹</button>
        <h1>编辑场景</h1>
        <button class="text-btn" id="undoButton">撤销</button>
        <button class="save-btn" id="saveButton">保存</button>
      </header>
      <nav class="topnav" id="topnav" aria-label="主要页面">
        <button class="active" data-panel="scene"><span>⌂</span>场景</button>
        <button data-panel="plan"><span>☆</span>我的方案</button>
        <button data-panel="favorite"><span>♡</span>收藏</button>
        <button data-panel="settings"><span>⚙</span>设置</button>
      </nav>
      <div class="placed-layer" id="dropZone" aria-label="可放置声音的场景"></div>
      <div class="editor-guide hidden" id="editorGuide" role="status">轻点素材调音量，长按后拖入场景</div>
      <div class="scene-trash" id="sceneTrash" aria-hidden="true">移到这里删除</div>
      <div class="drag-overlay" id="dragOverlay" aria-hidden="true">
        <svg class="drag-guide" id="dragGuide" viewBox="0 0 100 100" preserveAspectRatio="none"><path id="dragGuidePath" d=""></path></svg>
        <div class="drag-preview" id="dragPreview">
          <img class="entity-ghost" id="dragGhostImage" alt="" />
        </div>
        <div class="drag-chip" id="dragChip" draggable="false"><img id="dragChipImage" alt="" /></div>
      </div>
      <section class="sound-sheet" aria-label="声音盒">
        <div class="handle" id="sheetHandle" role="button" aria-label="向下拖动隐藏声音盒"></div>
        <div class="sheet-head"><h2>声音盒</h2><span id="soundCount">6 个室内声音</span></div>
        <div class="categories" id="categories">
          <button class="active" data-category="indoor" aria-pressed="true">室内</button>
          <button data-category="outdoor" aria-pressed="false">户外</button>
        </div>

    function leaveEditor(){if(!sceneDirty){exitEditor();return}if(typeof window.showMianyuDialog==='function'){window.showMianyuDialog('保存本次修改？','场景还有未保存的改动。你可以保存后退出，也可以放弃本次修改。',async()=>{if(await saveScene())exitEditor()},{confirmText:'保存并退出',discardText:'放弃修改',onDiscard:()=>{const saved=JSON.parse(savedSceneSnapshot);outdoor=!!saved.outdoor;placed=saved.placed||[];secondsLeft=saved.secondsLeft||1800;sceneDirty=false;switchSpace(outdoor,false);exitEditor()}})}else if(confirm('场景尚未保存，是否保存？'))saveScene().then(ok=>{if(ok)exitEditor()})}
    function confirmSaved(){const button=$('saveButton');button.textContent='已保存';button.classList.add('saved');button.disabled=true;showToast('场景已保存，可以继续试听或返回');setTimeout(()=>{button.textContent='保存';button.classList.remove('saved');button.disabled=false},1400)}
    function sceneDto(){return {id:'scene-demo',name:outdoor?'雨夜小院':'我的睡前小屋',status:'draft',version:1,sources:placed.map(entry=>{const item=sounds.find(sound=>sound.id===entry.id);return {id:'source-'+entry.id,track:{asset_id:entry.id,name:item?.name||entry.id,asset_path:iconPath(item||{icon:'room_tone'},'png'),default_space:item?.space||'indoor'},space:item?.space||'indoor',x:entry.x,y:entry.y,volume:Number(entry.volume??Number($('masterVolume').value)/100),enabled:true}})}}
    $('undoButton').addEventListener('click',()=>{if(!placed.length){showToast('没有可以撤销的操作');return}placed.pop();selectedPlacedIndex=null;markSceneDirty();renderPlaced();renderGrid();renderTrackControl();showToast('已撤销上一步')});$('backEdit').addEventListener('click',event=>{event.stopImmediatePropagation();leaveEditor()});$('saveButton').addEventListener('click',saveScene);
    function showView(id){document.querySelectorAll('.view').forEach(view=>view.classList.toggle('active',view.id===id))}
    async function startSleep(){if(!placed.length){['A03','A01','A04'].forEach((id,index)=>{placed.push({id,x:22+index*26,y:35,volume:Number($('masterVolume').value)/100})});renderPlaced()}try{const scene=await window.MianyuPorts.sceneQuery.saveDraft(sceneDto());savedSceneSnapshot=snapshotScene();sceneDirty=false;await window.MianyuPorts.sleepSession.start({plan_id:'plan-demo',scene_id:scene.id})}catch(error){showToast(error.message||'会话启动失败');return}showView('sleepView');paused=false;$('pauseButton').textContent='Ⅱ';$('sleepMessage').textContent='声音正在陪着你';startTimer()}
    function startTimer(){clearInterval(timer);timer=setInterval(()=>{if(!paused&&secondsLeft>0){secondsLeft--;renderClock()}},1000);renderClock()}
    function renderClock(){const min=Math.floor(secondsLeft/60),sec=secondsLeft%60;$('clock').textContent=`${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
    $('startButton').addEventListener('click',startSleep);$('pauseButton').addEventListener('click',async()=>{paused=!paused;try{await (paused?window.MianyuPorts.sleepSession.pause():window.MianyuPorts.sleepSession.resume())}catch(error){paused=!paused;showToast(error.message||'会话状态更新失败')}$('pauseButton').textContent=paused?'▶':'Ⅱ';$('sleepMessage').textContent=paused?'已暂停':'声音正在陪着你'});$('timeSelect').addEventListener('change',event=>{secondsLeft=Number(event.target.value)*60;renderClock();markSceneDirty()});$('exitSleep').addEventListener('click',async()=>{clearInterval(timer);try{await window.MianyuPorts.sleepSession.stop()}catch(_){}showView('sceneView');setEditing(true);showToast('已结束本次播放，可继续调整场景')});
    const presets=['赶作业，想听雨，不要打雷。','明天考试，只剩十五分钟。','不要人声。','心情不好，想有人陪一会儿。'];
    function planPanel(){return `<div class="panel-card"><h2>今晚想怎么被陪伴？</h2><p>选一句最接近现在状态的话，方案会说明理由，也可以继续修改。</p>${presets.map((text,index)=>`<button class="preset" data-preset="${index}">${text}</button>`).join('')}</div><div class="panel-card"><div style="display:flex;justify-content:space-between;gap:10px"><h3>当前方案</h3><span class="tag">规则建议</span></div><p id="planReason">室内暖声搭配窗外小雨，层次清楚但不过度刺激。</p><div class="tag">30 分钟 · 最后 5 分钟渐弱</div></div>`}
    function favoritePanel(){return `<div class="panel-card"><h2>收藏</h2><p>收藏只保存你主动选择的内容。</p>${['A01','A03','A04','A09'].map(id=>{const item=sounds.find(s=>s.id===id);return `<div class="list-row"><img src="${iconPath(item)}" alt=""><div><strong>${item.name}</strong><small>已审核 · 可加入睡前小屋</small></div><button class="text-btn">加入</button></div>`}).join('')}</div>`}
    function settingsPanel(){return `<div class="panel-card"><div style="display:flex;align-items:center;gap:14px"><img class="about-logo" src="assets/images/brand/app_icon_circle.png" alt="眠屿圆形图标"><div><h2>眠屿</h2><p style="margin:4px 0 0">在声音里，遇见更好的自己</p></div></div></div><div class="panel-card"><div class="list-row"><div><strong>夜晚低光模式</strong><small>降低界面刺激与动效</small></div><button class="switch on" aria-label="夜晚低光模式"></button></div><div class="list-row"><div><strong>儿童模式</strong><small>过滤成人故事与自由对话</small></div><button class="switch" aria-label="儿童模式"></button></div><div class="list-row"><div><strong>保存播放记录</strong><small>只记录应用使用事实</small></div><button class="switch on" aria-label="保存播放记录"></button></div></div><div class="panel-card"><h3>说明</h3><p>眠屿不是医疗产品，不能诊断失眠。</p></div>`}
    document.querySelectorAll('[data-panel]').forEach(button=>button.addEventListener('click',()=>{const panel=button.dataset.panel;if(panel==='scene')return;showView('panelView');$('panelTitle').textContent=panel==='plan'?'我的方案':panel==='favorite'?'收藏':'设置';$('panelContent').innerHTML=panel==='plan'?planPanel():panel==='favorite'?favoritePanel():settingsPanel();bindPanel()}));
    function bindPanel(){document.querySelectorAll('[data-preset]').forEach(button=>button.addEventListener('click',()=>{const index=Number(button.dataset.preset);$('planReason').textContent=index===0?'保留小雨与雨打窗户，明确排除远雷。':index===1?'使用十五分钟短方案，以室内底噪和轻键盘为主。':index===2?'只保留环境声，不加入任何故事或人声。':'加入已审核模板故事，并用小雨与室内底噪托住声音。';showToast('今晚方案已更新')}));document.querySelectorAll('.switch').forEach(button=>button.addEventListener('click',()=>button.classList.toggle('on')))}
    $('closePanel').addEventListener('click',()=>showView('sceneView'));
    setBackground();renderGrid();renderClock();savedSceneSnapshot=snapshotScene();
  </script>
  <script>
    (function installSoundScrollbar(){
      const bar=$('gridScrollbar'),thumb=$('gridScrollThumb');let drag=null;
      function measurements(){const max=Math.max(0,soundGrid.scrollWidth-soundGrid.clientWidth),inner=Math.max(1,bar.clientWidth-8),thumbWidth=Math.max(58,inner*(soundGrid.clientWidth/soundGrid.scrollWidth)),travel=Math.max(0,inner-thumbWidth);return{max,inner,thumbWidth,travel}}
      function update(){const max=Math.max(0,soundGrid.scrollWidth-soundGrid.clientWidth);bar.classList.toggle('is-hidden',max<=1);if(max>1&&bar.clientWidth===0){requestAnimationFrame(update);return}const {thumbWidth,travel}=measurements(),ratio=max?Math.min(1,Math.max(0,soundGrid.scrollLeft/max)):0;thumb.style.width=`${thumbWidth}px`;thumb.style.transform=`translateX(${travel*ratio}px)`;bar.setAttribute('aria-valuenow',String(Math.round(ratio*100)))}
      function moveTo(clientX){const rect=bar.getBoundingClientRect(),{max,thumbWidth,travel}=measurements();if(!max||!travel)return;const ratio=Math.min(1,Math.max(0,(clientX-rect.left-4-thumbWidth/2)/travel));soundGrid.scrollLeft=ratio*max;update()}
      bar.addEventListener('pointerdown',event=>{const thumbRect=thumb.getBoundingClientRect();if(event.clientX<thumbRect.left||event.clientX>thumbRect.right)moveTo(event.clientX);drag={id:event.pointerId,startX:event.clientX,startScroll:soundGrid.scrollLeft};bar.classList.add('dragging');bar.setPointerCapture?.(event.pointerId);event.preventDefault()});
      bar.addEventListener('pointermove',event=>{if(!drag||drag.id!==event.pointerId)return;const {max,travel}=measurements();if(travel)soundGrid.scrollLeft=Math.min(max,Math.max(0,drag.startScroll+(event.clientX-drag.startX)*max/travel));event.preventDefault()});
      function finish(event){if(!drag||drag.id!==event.pointerId)return;bar.releasePointerCapture?.(event.pointerId);drag=null;bar.classList.remove('dragging');update()}
      bar.addEventListener('pointerup',finish);bar.addEventListener('pointercancel',finish);bar.addEventListener('keydown',event=>{const step=event.key==='PageDown'||event.key==='PageUp'?soundGrid.clientWidth*.8:72;const direction=event.key==='ArrowRight'||event.key==='PageDown'?1:event.key==='ArrowLeft'||event.key==='PageUp'?-1:0;if(!direction)return;event.preventDefault();soundGrid.scrollBy({left:direction*step,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})});soundGrid.addEventListener('scroll',update,{passive:true});window.addEventListener('resize',update,{passive:true});window.updateSoundScrollbar=update;if(typeof ResizeObserver!=='undefined')new ResizeObserver(update).observe(soundGrid);
      const baseRenderGrid=renderGrid;renderGrid=function(){baseRenderGrid();requestAnimationFrame(update)};renderGrid();
    })();
    // A short hold separates deliberate placement from ordinary horizontal swiping.
    (function installLongPressDrag(){
      const state={item:null,id:null,active:false,startX:0,startY:0,lastX:0,lastY:0,source:null,timer:null};
      function clearState(){clearTimeout(state.timer);Object.assign(state,{item:null,id:null,active:false,startX:0,startY:0,lastX:0,lastY:0,source:null,timer:null});pointerDrag={item:null,id:null,moved:false,startX:0,startY:0}}
      function point(event){const rect=dragOverlay.getBoundingClientRect();return{x:(event.clientX-rect.left)/rect.width*100,y:(event.clientY-rect.top)/rect.height*100}}
      soundGrid.addEventListener('pointerdown',event=>{const button=event.target.closest('.sound-card');if(!button||button.disabled)return;const item=sounds.find(sound=>sound.id===button.dataset.soundId);if(!item)return;Object.assign(state,{item,id:event.pointerId,active:false,startX:event.clientX,startY:event.clientY,lastX:event.clientX,lastY:event.clientY,source:button});state.timer=setTimeout(()=>{state.active=true;button.setPointerCapture?.(event.pointerId);const p=point(event);setEditing(true);showDragPreview(item,p.x,p.y);navigator.vibrate?.(18)},340)},true);
      soundGrid.addEventListener('pointermove',event=>{if(state.id!==event.pointerId||!state.item)return;state.lastX=event.clientX;state.lastY=event.clientY;if(!state.active){if(Math.hypot(event.clientX-state.startX,event.clientY-state.startY)>9){clearTimeout(state.timer);state.timer=null;skipNextClick=true}return}event.preventDefault();moveDragPreview(event)},true);
      function finish(event){if(state.id!==event.pointerId||!state.item)return;const active=state.active,item=state.item,x=event.clientX||state.lastX,y=event.clientY||state.lastY;state.source?.releasePointerCapture?.(event.pointerId);if(active){event.preventDefault();skipNextClick=true;const rect=dropZone.getBoundingClientRect();if(x>=rect.left&&x<=rect.right&&y>=rect.top&&y<=rect.bottom)addSound(item,(x-rect.left)/rect.width*100,(y-rect.top)/rect.height*100);else{hideDragPreview();showToast('请长按后拖到上方场景中')}}clearState()}
      soundGrid.addEventListener('pointerup',finish,true);soundGrid.addEventListener('pointercancel',event=>{if(state.active)hideDragPreview();clearState()},true);
      renderGrid();
    })();
  </script>
