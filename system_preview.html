<body>
  <main class="phone" id="app" aria-label="眠屿移动端应用">
    <section class="view active" id="sceneView">
      <div class="scene-bg" id="sceneBg"></div>
      <header class="brandbar" id="brandbar">
        <img class="brand-icon" src="assets/images/brand/app_icon.png" alt="眠屿图标" />
        <div class="brand-copy"><strong>眠屿</strong><span>在声音里，遇见更好的自己</span></div>
        <button class="mode-pill" id="modeButton" type="button"><b>☾</b><span>夜晚</span><span>⌄</span></button>
      </header>
      <header class="editbar hidden" id="editbar">
        <button class="round-btn" id="backEdit" aria-label="返回">‹</button>
        <h1>编辑场景</h1>
        <button class="text-btn" id="undoButton">撤销</button>
        <button class="save-btn" id="saveButton">保存</button>
      </header>
      <nav class="topnav" id="topnav" aria-label="主要页面">
        <button class="active" data-panel="scene"><span>⌂</span>场景</button>
        <button data-panel="plan"><span>☆</span>我的方案</button>
        <button data-panel="favorite"><span>♡</span>收藏</button>
        <button data-panel="settings"><span>⚙</span>设置</button>
      </nav>
      <div class="placed-layer" id="dropZone" aria-label="可放置声音的场景"></div>
      <div class="drag-overlay" id="dragOverlay" aria-hidden="true">
        <svg class="drag-guide" id="dragGuide" viewBox="0 0 100 100" preserveAspectRatio="none"><path id="dragGuidePath" d=""></path></svg>
        <div class="drag-preview" id="dragPreview">
          <img class="entity-ghost" id="dragGhostImage" alt="" />
        </div>
        <div class="drag-chip" id="dragChip" draggable="false"><img id="dragChipImage" alt="" /></div>
      </div>
      <section class="sound-sheet" aria-label="声音盒">
        <div class="handle" id="sheetHandle" role="button" aria-label="向下拖动隐藏声音盒"></div>
        <div class="sheet-head"><h2>声音盒</h2><span id="soundCount">6 个室内声音</span></div>
        <div class="categories" id="categories">
          <button class="active" data-category="indoor" aria-pressed="true">室内</button>
          <button data-category="outdoor" aria-pressed="false">户外</button>
        </div>
        <div class="sound-grid" id="soundGrid" aria-label="横向滑动查看全部声音素材"></div>
        <div class="grid-scrollbar" id="gridScrollbar" aria-hidden="true"><span id="gridScrollThumb"></span></div>
        <div class="sheet-controls">
          <button class="room-select" id="roomButton">▥&nbsp; 我的睡前小屋⌄</button>
          <button class="start-btn" id="startButton">▶&nbsp; 开始睡眠</button>
          <button class="circle-control" id="timerButton" aria-label="设置时间">◷</button>
          <label class="volume-row">🔊 <input id="masterVolume" type="range" min="0" max="100" value="62" aria-label="总音量" /></label>
        </div>
      </section>
    </section>

    <section class="view sleep-view" id="sleepView">
      <div class="sleep-title">睡眠模式</div>
      <div class="sleep-status"><small id="sleepMessage">声音正在陪着你</small><strong id="clock">30:00</strong></div>
      <div class="sleep-controls">
        <button class="pause-btn" id="pauseButton" aria-label="暂停">Ⅱ</button>
        <select class="time-select" id="timeSelect" aria-label="播放时长"><option value="15">15 分钟</option><option value="30" selected>30 分钟</option><option value="45">45 分钟</option><option value="60">60 分钟</option></select>
        <label class="sleep-volume">🔊 <input id="sleepVolume" type="range" min="0" max="100" value="62" aria-label="睡眠模式音量" /></label>
        <button class="exit-btn" id="exitSleep" aria-label="退出睡眠模式">×</button>
      </div>
    </section>

    <section class="view" id="panelView">
      <div class="screen-panel">
        <header class="screenbar"><button class="round-btn" id="closePanel" aria-label="返回场景">‹</button><h1 id="panelTitle">我的方案</h1><span style="width:48px"></span></header>
        <div id="panelContent"></div>
      </div>
    </section>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
