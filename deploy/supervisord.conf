[supervisord]
nodaemon=true
logfile=/hy-tmp/mianyu/logs/supervisord.log
pidfile=/tmp/mianyu-supervisord.pid

[program:nginx]
command=nginx -c /hy-tmp/mianyu/deploy/nginx.conf
autostart=true
autorestart=true
priority=20
stdout_logfile=/hy-tmp/mianyu/logs/nginx.out.log
stderr_logfile=/hy-tmp/mianyu/logs/nginx.err.log

[program:llamacpp]
; 命令文件在抄入真实 llama 参数之前会直接退出。保持 autostart=false，避免把正在占用显卡的 Qwen 打崩。
command=/bin/sh /hy-tmp/mianyu/app/deploy/llamacpp.command
autostart=false
autorestart=false
priority=10
stdout_logfile=/hy-tmp/mianyu/logs/llamacpp.out.log
stderr_logfile=/hy-tmp/mianyu/logs/llamacpp.err.log

[program:tts]
command=python server.py
directory=/hy-tmp/mianyu/app/services/tts
autostart=true
autorestart=true
priority=10
stdout_logfile=/hy-tmp/mianyu/logs/tts.out.log
stderr_logfile=/hy-tmp/mianyu/logs/tts.err.log

[program:mianyu]
command=node --env-file=/hy-tmp/mianyu/.env --experimental-transform-types src/server.ts
directory=/hy-tmp/mianyu/app/backend
environment=DRAMA_WORKER="1"
autostart=true
autorestart=true
priority=30
stdout_logfile=/hy-tmp/mianyu/logs/mianyu.out.log
stderr_logfile=/hy-tmp/mianyu/logs/mianyu.err.log

[program:comfyui]
command=python main.py --listen 127.0.0.1 --port 8188 --cuda-device 0
directory=/hy-tmp/comfyui
autostart=false
autorestart=false
priority=40
stdout_logfile=/hy-tmp/mianyu/logs/comfyui.out.log
stderr_logfile=/hy-tmp/mianyu/logs/comfyui.err.log
